<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人超勤計算</title>
    <style>
        /* 基礎樣式 */
        body {
            margin: 0;
            padding: 15px;
            font-size: 1.5em;
        }
        
        h1 {
            font-size: 1.5em;
            margin: 0;
            padding: 10px 0;
        }
        
        input[type=number].small-input {
            width: 60px;
            padding: 5px;
            font-size: 1em;
        }
        
        select {
            font-size: 1em;
        }

        /* 區塊基礎樣式 */
        .section-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 綠色區塊內容排版 */
        .green-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .green-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .green-section,
        .red-section,
        .blue-section,
        .yellow-section,
        .white-section {
            padding: 10px;
        }

        .green-section {
            background-color: #e6ffe6;
            width: 100%;
        }

        .red-section {
            background-color: #ffe6e6;
        }

        .blue-section {
            background-color: #e6f2ff;
        }

        .yellow-section {
            background-color: #fffff0;
        }

        .white-section {
            background-color: #ffffff;
        }

        /* 手機版樣式 */
        @media screen and (max-width: 768px) {
            body {
                padding: 0;
            }
            
            .green-section,
            .red-section,
            .blue-section,
            .yellow-section,
            .white-section {
                width: 100%;
                box-sizing: border-box;
            }

            .section-container {
                flex-direction: column;
            }

            /* 手機版綠色區塊排版 */
            .green-content {
                flex-direction: column;
            }

            .green-item {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .green-item label {
                min-width: 80px;
            }

            .green-item span {
                margin-left: auto;
            }
        }

        /* 電腦版樣式 */
        @media screen and (min-width: 769px) {
            .green-section {
                width: 100%;
            }
            
            .flex-row {
                display: flex;
                gap: 10px;
                width: 100%;
            }

            .red-section {
                width: 50%;
            }

            .blue-section {
                width: 50%;
            }

            .yellow-section {
                width: 50%;
            }

            .white-section {
                width: 50%;
            }

            /* 電腦版綠色區塊排版 */
            .green-content {
                justify-content: space-between;
            }

            .green-item {
                width: auto;
            }

            .green-item.full-width {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="section-container">
        <!-- 綠色區塊 -->
        <div class="green-section">
            <h1>臺南市消防局外勤工時計算</h1>
            <div class="green-content">
                <!-- 班別選擇 -->
                <div class="green-item full-width">
                    <label>班別：</label>
                    <select id="classSelect" onchange="calculateClassDays(); calculateTotalLeave(); saveClassSelection();">
                        <option value="A">Ａ班(勤2休2，12/31、1/1上班)</option>
                        <option value="B">Ｂ班(勤2休2，1/2、1/3上班)</option>
                        <option value="C">Ｃ班(勤2休2，1/1、1/2上班)</option>
                        <option value="D">Ｄ班(勤2休2，1/3、1/4上班)</option>
                        <option value="E">Ｅ班(勤1休1，1/1上班)</option>
                        <option value="F">Ｆ班(勤1休1，1/2上班)</option>
                    </select>
                    <a href="readme.html">說明</a>
                </div>

                <!-- 時薪和報滿加班費 -->
                <div class="green-item">
                    <label>時薪：</label>
                    <input type="number" id="HourMoney" placeholder="時薪" class="small-input" min="0" step="1" style="-moz-appearance: textfield;" oninput="saveHourMoney();">
                </div>
                <div class="green-item">
                    <label>報滿加班費時數：</label>
                    <span id="AllMoney"></span> 小時
                </div>

                <!-- 年月選擇和基本工時 -->
                <div class="green-item">
                    <label>月份：</label>
                    <select id="yearSelect" onchange="calculateClassDays(); calculateTotalLeave();">
                        <option value="2025">114</option>
                        <option value="2026">115</option>
                        <option value="2027">116</option>
                    </select>
                    年
                    <select id="monthSelect" onchange="calculateClassDays(); calculateTotalLeave();">
                        <!-- 月份選項 -->
                    </select>
                    月
                </div>
                <div class="green-item">
                    <label>基本工時：</label>
                    <span id="BasicHour"></span>
                </div>

                <!-- 本月工時和加班費資訊 -->
                <div class="green-item">
                    <label>本月工時：</label>
                    <span id="WorkHour1"></span>
                </div>
                <div class="green-item">
                    <label>可領加班費：</label>
                    <span id="WorkMoney"></span>
                </div>
                <div class="green-item">
                    <label>累積工時：</label>
                    <span id="WorkHour2"></span>
                </div>
            </div>
        </div>

        <!-- 其他區塊保持不變 -->
        <div class="flex-row">
            <div class="red-section">
                <!-- 紅色區塊內容 -->
            </div>
            <div class="blue-section">
                <!-- 藍色區塊內容 -->
            </div>
        </div>

        <div class="flex-row">
            <div class="yellow-section">
                <!-- 黃色區塊內容 -->
            </div>
            <div class="white-section">
                <!-- 白色區塊內容 -->
            </div>
        </div>
    </div>
</body>
</html>
